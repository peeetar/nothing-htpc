<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME</title>
<style>
  /* Every value here comes from theme.json via theme.js. A literal colour,
     duration or spacing in this stylesheet is a bug: it is a value that a
     reskin cannot reach. The only literals are structural (0, 50%, 100%). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--size-base);
    overflow: hidden;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }
  /* The page is composited over mpv. Where the UI paints nothing, the video
     shows through — which is why `body` is only opaque on screens that own
     the whole display. #stage never gets a background of its own. */
  body.transparent { background: transparent; }

  #stage { height: 100vh; position: relative; }

  /* Views are stacked, not swapped: the incoming one fades up over an
     outgoing one that stays fully opaque until the fade ends. A symmetric
     crossfade dips through black at 50% and defeats the whole point of
     keeping these screens in one page. (CLAUDE.md constraint 15.) */
  .view {
    position: absolute; inset: 0;
    padding: var(--space-pad-y) var(--space-pad-x);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity var(--motion-view) var(--motion-ease-out);
  }
  .view.on { opacity: 1; }
  .view.front { z-index: 2; }
  .view.opaque { background: var(--bg); }

  /* ---------- shared furniture ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    letter-spacing: var(--track-label);
    font-size: var(--size-base);
    color: var(--dim);
  }
  .lead { display: flex; align-items: center; gap: 0.9em; }
  .reddot {
    width: 0.62em; height: 0.62em;
    background: var(--red);
    border-radius: 50%;
    flex: none;
    animation: breathe var(--motion-breathe) ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .hints {
    display: flex;
    gap: 3.5em;
    margin-top: var(--space-5);
    letter-spacing: var(--track-label);
    font-size: var(--size-micro);
    color: var(--faint);
  }
  .hints b { color: var(--dim); font-weight: 400; }

  /* ---------- home ---------- */
  #weather-brief { text-align: right; line-height: 1.9; }
  #weather-brief .temp { color: var(--ink); }
  #weather-brief .tag { font-size: 0.72em; color: var(--faint); letter-spacing: var(--track-label); }

  #clockzone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--space-4);
  }
  #clock { line-height: 0; }
  #greeting {
    letter-spacing: var(--track-wide);
    font-size: var(--size-small);
    color: var(--dim);
  }

  #menu {
    display: flex;
    gap: var(--layout-menu-gap);
    align-items: flex-end;
    padding-bottom: var(--space-1);
  }
  .tile {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    opacity: 0.38;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                transform var(--motion-quick) var(--motion-ease-out);
  }
  .tile .icon { height: clamp(26px, 3vw, 40px); }
  .tile .icon svg {
    height: 100%; width: auto; display: block;
    stroke: var(--ink); fill: none;
    stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
  }
  .tile .label {
    letter-spacing: var(--track-label);
    font-size: var(--size-small);
    color: var(--ink);
    white-space: nowrap;
  }
  .tile .dotlabel { display: none; line-height: 0; }
  .tile .marker {
    width: 0.45em; height: 0.45em;
    border-radius: 50%;
    background: transparent;
  }
  .tile.sel { opacity: 1; transform: translateY(calc(-1 * var(--space-2))); }
  .tile.sel .label { display: none; }
  .tile.sel .dotlabel { display: block; }
  .tile.sel .marker { background: var(--red); }

  #nowplaying {
    display: flex; align-items: center; gap: 0.9em;
    min-height: 2.4em;
    margin-bottom: var(--space-3);
    letter-spacing: var(--track-label);
    font-size: var(--size-micro);
    color: var(--dim);
    opacity: 0;
    transition: opacity var(--motion-toast) var(--motion-ease-out);
    white-space: nowrap; overflow: hidden;
  }
  #nowplaying.on { opacity: 1; }
  #nowplaying .npdot { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--red); flex: none; }
  #nowplaying .nplabel { color: var(--faint); }

  /* ---------- TV: the channel bar ----------
     This view paints nothing but the bar — the rest is mpv showing through.
     A scrim sits under the bar only, because white content behind white
     type is the one thing that makes it unreadable. */
  #tvview { padding: 0; }
  #tvview.view { background: transparent; }
  #chanbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--layout-bar-height);
    display: flex; align-items: center;
    gap: 2vw;
    padding: 0 var(--space-pad-x);
    background: var(--scrim);
    border-top: var(--line-hair) solid var(--rule);
    transform: translateY(100%);
    transition: transform var(--motion-view) var(--motion-ease);
  }
  #chanbar.show { transform: translateY(0); }
  #channum { line-height: 0; flex: none; }
  #channame {
    letter-spacing: var(--track-label);
    font-size: var(--size-large);
    color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  #chanclock {
    letter-spacing: var(--track-label);
    font-size: var(--size-large);
    color: var(--ink);
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  /* The one piece of discoverability on this screen: without it the channel
     list is a feature nobody on a sofa finds, because Ⓐ over full-screen
     video looks like it does nothing. */
  #barhint {
    letter-spacing: var(--track-label);
    font-size: var(--size-micro);
    color: var(--faint);
    flex: none;
    white-space: nowrap;
  }
  #barhint b { color: var(--dim); font-weight: 400; }

  /* ---------- TV: the channel list ----------
     The dial made visible. It slides in over the video rather than replacing
     it — the picture keeps playing behind, which is the whole reason the
     launcher is one transparent page. Red marks the channel that is on;
     the glow marks the one the cursor is over. */
  #chanlist {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 36vw; min-width: 22em; max-width: 34em;
    background: var(--scrim);
    border-right: var(--line-hair) solid var(--rule);
    /* The bottom padding clears the channel bar: the list is full height so it
       reads as a panel and not as a popover, but its hints must never land
       under the bar that slides up while it is open. */
    padding: var(--space-pad-y) var(--space-4)
             calc(var(--layout-bar-height) + var(--space-3)) var(--space-pad-x);
    display: flex; flex-direction: column; gap: var(--space-3);
    transform: translateX(-101%);
    transition: transform var(--motion-view) var(--motion-ease);
    z-index: 4;
  }
  #chanlist.on { transform: translateX(0); }
  #chanlist .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 1.4em; }
  #chanhead { line-height: 0; }
  #chancount { letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint); }
  #chanrows { display: flex; flex-direction: column; gap: var(--space-1); }
  .chanrow {
    display: flex; align-items: center; gap: 1.2em;
    padding: 0.5em 0.8em;
    outline: var(--line-hair) solid transparent;
    opacity: 0.45;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                outline-color var(--motion-quick) var(--motion-ease-out),
                box-shadow var(--motion-quick) var(--motion-ease-out);
  }
  /* flex, not line-height:0 — an inline SVG sits on the text baseline and the
     number ends up riding above the name it belongs to. Its width is set per
     render from the dot engine, so the column fits the longest number. */
  .chanrow .cno { flex: none; display: flex; align-items: center; }
  .chanrow .cname {
    flex: 1; min-width: 0;
    letter-spacing: var(--track-label); font-size: var(--size-small); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: none;
  }
  /* State, not focus: this is the channel currently tuned, which is often not
     the one under the cursor. */
  .chanrow .clive { width: 0.5em; height: 0.5em; border-radius: 50%; background: transparent; flex: none; }
  .chanrow.live .clive { background: var(--red); }
  .chanrow.sel { opacity: 1; outline-color: var(--ink); box-shadow: var(--glow-card-tight); }
  #chanlist .hints { margin-top: auto; gap: 2.2em; }
  #chanstate {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: var(--track-wide);
    font-size: var(--size-small);
    color: var(--dim);
    display: flex; align-items: center; gap: 1.2em;
    opacity: 0;
    transition: opacity var(--motion-view) var(--motion-ease-out);
  }
  #chanstate.on { opacity: 1; }

  /* ---------- MOVIES / SHOWS: the stream picker ----------
     The channel list's twin, and deliberately so: same windowed rows, same
     two markers, mirrored to come in from the right because it belongs to
     the detail panel rather than to the picture. Red is the source that is
     playing, the glow is the row the cursor is over — usually different
     rows, which is the same lesson the channel list teaches.

     It exists because a torrent is not a channel: the first copy of a film
     can simply not be there, and the only useful answer to that is the next
     copy, not an error. */
  #sources {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 52vw; min-width: 30em; max-width: 52em;
    /* Opaque, unlike the channel list. That one is a scrim because live video
       is behind it and the whole point is that the picture keeps playing;
       this one has the detail panel behind it, and letting a film synopsis
       show through a list of torrents is just two texts fighting. */
    background: var(--bg);
    border-left: var(--line-hair) solid var(--rule);
    padding: var(--space-pad-y) var(--space-pad-x) var(--space-4) var(--space-4);
    display: flex; flex-direction: column; gap: var(--space-3);
    transform: translateX(101%);
    transition: transform var(--motion-view) var(--motion-ease);
    z-index: 6;
  }
  #sources.on { transform: translateX(0); }
  #sources .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 1.4em; }
  #srchead { line-height: 0; }
  #srccount { letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint); }
  #srcrows { display: flex; flex-direction: column; gap: var(--space-1); }
  .srcrow {
    display: flex; align-items: center; gap: 1.1em;
    padding: 0.5em 0.8em;
    outline: var(--line-hair) solid transparent;
    opacity: 0.45;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                outline-color var(--motion-quick) var(--motion-ease-out),
                box-shadow var(--motion-quick) var(--motion-ease-out);
  }
  /* Same flex trick as .chanrow .cno — an inline SVG would otherwise sit on
     the text baseline and ride above the row it labels. Its width is set per
     render from the dot engine, so the column fits the longest quality tag
     and every source name starts at the same x. */
  .srcrow .sq { flex: none; display: flex; align-items: center; }
  .srcrow .sname {
    flex: 1; min-width: 6em;
    letter-spacing: var(--track-tight); font-size: var(--size-small); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: none;
  }
  .srcrow .ssize, .srcrow .sseeds {
    flex: none; letter-spacing: var(--track-label);
    font-size: var(--size-micro); color: var(--dim);
    white-space: nowrap;
  }
  .srcrow .ssize { min-width: 5.5em; text-align: right; }
  .srcrow .sseeds { min-width: 5em; text-align: right; }
  /* A debrid link plays now; a torrent has to find peers first. Worth one
     character of difference before Ⓐ rather than a surprise after it. */
  .srcrow .stag {
    flex: none; letter-spacing: var(--track-label);
    font-size: var(--size-micro); color: var(--faint);
    min-width: 4.2em; white-space: nowrap;
  }
  .srcrow.outside .sq { opacity: 0.5; }
  .srcrow .slive { width: 0.5em; height: 0.5em; border-radius: 50%; background: transparent; flex: none; }
  .srcrow.live .slive { background: var(--red); }
  .srcrow.sel { opacity: 1; outline-color: var(--ink); box-shadow: var(--glow-card-tight); }
  #sources .hints { margin-top: auto; gap: 2.2em; }
  #srcempty {
    letter-spacing: var(--track-wide); font-size: var(--size-small);
    color: var(--dim);
  }

  /* The dot indicator that replaced analog static. Three dots, one cycle. */
  .pulse { display: flex; gap: 0.55em; }
  .pulse i {
    width: 0.5em; height: 0.5em; border-radius: 50%;
    background: var(--ink); display: block;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .pulse i:nth-child(2) { animation-delay: 0.15s; }
  .pulse i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }

  /* digit entry, bottom-right, while a number is being typed */
  #digits {
    position: absolute; right: var(--space-pad-x); bottom: var(--layout-bar-height);
    margin-bottom: var(--space-3);
    line-height: 0;
    opacity: 0;
    transition: opacity var(--motion-quick) var(--motion-ease-out);
  }
  #digits.on { opacity: 1; }

  /* ---------- poster grids (MOVIES / SHOWS) ---------- */
  .gridhead { display: flex; justify-content: space-between; align-items: baseline; }
  .gridtitle { line-height: 0; }
  .gridcount { letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint); }
  /* The viewport. A page is grid-rows-per-page rows deep and only the rows
     that fit are visible; #gridinner slides under this as the cursor moves.
     grid-offset drops it clear of the title above, because the selected card
     scales up and was clipping into it. */
  .grid {
    flex: 1;
    overflow: hidden;
    margin-top: calc(var(--space-4) + var(--layout-grid-offset));
    /* The glow on a selected card in the top row would be cut off by the
       viewport edge, so the inner grid is inset and the padding gives it
       room to bleed. */
    padding: 0.8vh 0.5vw;
    margin-left: -0.5vw;
    margin-right: -0.5vw;
  }
  #gridinner {
    display: grid;
    grid-template-columns: repeat(var(--layout-grid-columns), 1fr);
    /* max-content, not the default auto: the cards carry an aspect-ratio, and
       an auto row inside a height-constrained grid gets squeezed while the
       card keeps its own height — which makes every row overlap the one
       below it. Sizing rows to their content is what stops that. */
    grid-auto-rows: max-content;
    gap: var(--layout-grid-gap);
    align-content: start;
    transition: transform var(--motion-grid-scroll) var(--motion-ease);
  }
  .card {
    position: relative;
    aspect-ratio: var(--layout-poster-aspect);
    background: var(--panel);
    outline: var(--line-hair) solid transparent;
    outline-offset: 0;
    opacity: 0.55;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                transform var(--motion-quick) var(--motion-ease-out),
                box-shadow var(--motion-quick) var(--motion-ease-out),
                outline-color var(--motion-quick) var(--motion-ease-out);
    overflow: hidden;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Fallback when a poster is missing or still loading — the title in the
     grid's own language rather than a broken-image glyph. */
  .card .stub {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1em; text-align: center;
    font-size: var(--size-small); letter-spacing: var(--track-tight);
    color: var(--dim);
    flex-direction: column; gap: 0.6em;
    text-transform: none;
  }
  .card .stub .y { color: var(--faint); letter-spacing: var(--track-label); font-size: 0.85em; }
  /* A poster that loaded covers the stub; one that never arrives leaves the
     title readable rather than leaving a grey rectangle. */
  .card img + .stub { display: none; }
  /* Selection is light coming off the card. The red bar this replaced read as
     a progress indicator and fought with the poster art underneath it. */
  .card.sel {
    opacity: 1;
    transform: scale(1.04);
    outline-color: var(--ink);
    box-shadow: var(--glow-card);
    z-index: 2;
  }

  /* detail overlay */
  #detail {
    position: absolute; inset: 0;
    background: var(--bg);
    padding: var(--space-pad-y) var(--space-pad-x);
    display: flex; gap: 4vw;
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-view) var(--motion-ease-out);
    z-index: 3;
  }
  #detail.on { opacity: 1; pointer-events: all; }
  #dposter {
    width: var(--layout-detail-poster-width);
    aspect-ratio: var(--layout-poster-aspect);
    /* flex-start, or the default `stretch` overrides the aspect ratio and the
       poster is drawn to the full height of the panel. */
    align-self: flex-start;
    flex: none; background: var(--panel);
  }
  #dposter img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #dinfo { flex: 1; display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  #dtitle { line-height: 0; }
  #dmeta {
    display: flex; gap: 2.5em;
    letter-spacing: var(--track-label); font-size: var(--size-small); color: var(--dim);
  }
  #dmeta .rating { color: var(--red); }
  #dplot {
    font-size: var(--size-base); line-height: 1.85; color: var(--dim);
    letter-spacing: var(--track-tight);
    max-width: 62ch;
    /* Body copy is the one place the UI is not uppercase: Cyrillic and Greek
       synopses are unreadable in caps at couch distance. */
    text-transform: none;
  }

  /* credits — one line per role, label left, names right */
  /* The dot face's fallback for scripts it cannot draw — same role in the
     hierarchy, body font instead of dots. */
  .headingtext {
    letter-spacing: var(--track-label);
    font-size: var(--size-title);
    color: var(--ink);
    text-transform: none;
  }

  #dcredits { display: flex; flex-direction: column; gap: 0.7em; }
  #dcredits .row {
    display: flex; gap: 1.4em;
    font-size: var(--size-micro); letter-spacing: var(--track-label);
  }
  #dcredits .role { width: 9em; flex: none; color: var(--faint); }
  #dcredits .who { color: var(--dim); text-transform: none; letter-spacing: var(--track-tight); }

  /* reviews — the news marquee's idea turned vertical. One review at a time,
     held then cross-faded to the next, so three fit in the space of one
     without anything scrolling under the cursor's feet. */
  /* Not flex:1 — the reviews block is only as tall as a review needs, and the
     hints below claim the leftover with margin-top:auto. Giving this the
     remaining height instead left a review floating at the top of a very
     tall empty box. */
  #dreviews { flex: none; display: flex; flex-direction: column; gap: var(--space-2); }
  #dinfo .hints { margin-top: auto; }
  #dreviews .rhead {
    display: flex; align-items: center; gap: 1.2em;
    font-size: var(--size-micro); letter-spacing: var(--track-label); color: var(--faint);
  }
  #dreviews .rdots { display: flex; gap: 0.4em; }
  #dreviews .rdots i {
    width: 0.42em; height: 0.42em; border-radius: 50%;
    background: var(--faint); display: block;
  }
  #dreviews .rdots i.on { background: var(--red); }
  /* The reviews cross-fade, so they are stacked absolutely and the stack
     needs a height of its own. Four lines plus the star row is what fits;
     a review longer than that scrolls itself rather than being cut off. */
  #rstack { position: relative; height: var(--layout-detail-review-height); }
  .review {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; gap: 0.9em;
    opacity: 0;
    transition: opacity var(--motion-review-fade) var(--motion-ease-out);
    pointer-events: none;
  }
  .review.on { opacity: 1; }
  .review .rtop { display: flex; align-items: center; gap: 1.4em; }
  /* Two SVGs side by side — earned stars in ink, the rest in faint. */
  .review .rstars { display: flex; align-items: center; gap: 0.32em; line-height: 0; }
  .review .rauthor {
    font-size: var(--size-micro); letter-spacing: var(--track-label); color: var(--dim);
    text-transform: none;
  }
  /* A review is arbitrary length and the panel is not. This used to clamp it
     and fade the fourth line out, which read as "the rest of this sentence is
     gone" — so now .rbody is a viewport and .rtext crawls up inside it, holds
     at the bottom, and rides back. Same idea as the news marquee, turned
     vertical, and driven from the theme in px/s so a review twice as long
     takes twice as long rather than moving twice as fast. */
  .review .rbody {
    flex: 1; min-height: 0; overflow: hidden;
    font-size: var(--size-small); line-height: 1.75; color: var(--dim);
    letter-spacing: var(--track-tight); text-transform: none;
    max-width: 68ch;
  }
  .review .rtext { display: block; will-change: transform; }
  /* The mask only exists while there is text past the edge, and only on the
     ends that have any: a review that fits is not faded at all, and one
     scrolled to the bottom fades at the top instead of pretending the last
     line continues. */
  .review .rbody.more {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade-review)), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade-review)), transparent 100%);
  }
  .review .rbody.more.scrolled {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-review),
      #000 calc(100% - var(--fade-review)), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-review),
      #000 calc(100% - var(--fade-review)), transparent 100%);
  }
  .review .rbody.end.more.scrolled {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-review), #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-review), #000 100%);
  }

  /* ---------- SHOWS: seasons and episodes ----------
     Where a film has reviews a show has a dial of its own. Seasons are a tab
     strip (◂ ▸) and the episodes of the open one are a list (▴ ▾) — one
     screenful at a time, windowed, because a long-running show has hundreds
     and every row would otherwise be real DOM on a 1 GB box. */
  #dseasons { flex: none; display: flex; flex-direction: column; gap: var(--space-2); }
  /* Label left, position right — the count lines up with the air dates down
     the right edge of the episode list rather than crowding the label. */
  #dseasons .rhead {
    display: flex; align-items: center; justify-content: space-between; gap: 1.2em;
    max-width: 68ch;
    font-size: var(--size-micro); letter-spacing: var(--track-label); color: var(--faint);
  }
  #stabs {
    display: flex; gap: 0.5em;
    overflow: hidden; white-space: nowrap;
    padding: 0.2em 0;
  }
  .stab {
    flex: none;
    padding: 0.45em 1.1em;
    outline: var(--line-hair) solid var(--rule);
    letter-spacing: var(--track-label); font-size: var(--size-micro);
    color: var(--dim); opacity: 0.6;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                color var(--motion-quick) var(--motion-ease-out),
                outline-color var(--motion-quick) var(--motion-ease-out);
  }
  .stab.sel { opacity: 1; color: var(--ink); outline-color: var(--ink); box-shadow: var(--glow-card-tight); }
  /* Same measure as the plot and the reviews above it: a line of episode
     titles running the full width of a 55" screen is unreadable. */
  #eplist { display: flex; flex-direction: column; max-width: 68ch; }
  .eprow {
    display: flex; align-items: baseline; gap: 1.4em;
    padding: 0.4em 0.8em;
    outline: var(--line-hair) solid transparent;
    opacity: 0.5;
    transition: opacity var(--motion-quick) var(--motion-ease-out),
                outline-color var(--motion-quick) var(--motion-ease-out),
                box-shadow var(--motion-quick) var(--motion-ease-out);
  }
  .eprow .epno {
    flex: none; width: 3em;
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  /* An episode title can be in any script and is content, not a label — so
     body font, not uppercase. */
  .eprow .epname {
    flex: 1; min-width: 0;
    font-size: var(--size-small); letter-spacing: var(--track-tight); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: none;
  }
  .eprow .epdate {
    flex: none;
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .eprow.sel { opacity: 1; outline-color: var(--ink); box-shadow: var(--glow-card-tight); }
  #dseasons .empty {
    font-size: var(--size-small); letter-spacing: var(--track-label); color: var(--faint);
    padding: 0.8em;
  }

  /* ---------- NEWS ----------
     Time.mk on top, Θεσσαλονίκη on the bottom, split at the midline. Each
     source has category rows that scroll left; headlines are never wrapped,
     they are one row each, which is the rule the old teletext page earned
     the hard way. */
  #newsview { padding: var(--space-pad-y) 0; gap: var(--space-3); }
  #newsview .sourcehead {
    display: flex; align-items: baseline; gap: 1.4em;
    padding: 0 var(--space-pad-x);
  }
  #newsview .sourcehead .name { line-height: 0; }
  #newsview .sourcehead .region {
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
  }
  .newshalf { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); min-height: 0; overflow: hidden; }
  .newshalf + .newshalf { border-top: var(--line-hair) solid var(--rule); padding-top: var(--space-3); }
  /* Rows share their half evenly rather than stacking at the top — with
     four categories up top and one below, an even split is what keeps the
     midline reading as a split rather than as a gap. */
  .catrow { flex: 1; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  /* The label sits above the headlines and is opaque, so a headline scrolling
     past goes behind it rather than through it. It is a real stacking
     context, not just a z-index — the marquee is a sibling with its own
     clipping box, which is what actually stops the text escaping to the left. */
  .catrow .cat {
    flex: none;
    position: relative;
    z-index: 2;
    background: var(--bg);
    padding: 0.5em 1em;
    margin-left: var(--space-pad-x);
    border: var(--line-hair) solid var(--rule);
    letter-spacing: var(--track-label); font-size: var(--size-micro);
    color: var(--dim);
  }
  /* Headlines live in their own overflow box that starts after the label, so
     they cannot reach it. The mask fades them out over fade-edge of the row's
     width at both ends instead of cutting them mid-letter. */
  .catrow .marquee {
    flex: 1; min-width: 0; overflow: hidden;
    margin-left: 1.4em;
    -webkit-mask-image: linear-gradient(to right, transparent 0,
      #000 var(--fade-edge), #000 calc(100% - var(--fade-edge)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0,
      #000 var(--fade-edge), #000 calc(100% - var(--fade-edge)), transparent 100%);
  }
  .catrow .track {
    display: inline-flex; gap: 3.5em;
    animation: marquee linear infinite;
    will-change: transform;
  }
  .catrow .item {
    letter-spacing: var(--track-tight); font-size: var(--size-small);
    color: var(--ink); text-transform: none;
  }
  .catrow .item::before {
    content: "·"; color: var(--red); margin-right: 1em;
  }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---------- WEATHER ---------- */
  #wxgrid { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--space-4); }
  .wxcity {
    display: flex; align-items: center; gap: 3vw;
    padding-bottom: var(--space-3);
  }
  .wxcity + .wxcity { border-top: var(--line-hair) solid var(--rule); padding-top: var(--space-3); }
  /* Name and the current reading travel together on the left — what the
     screen was missing was *now*. Three days of forecast with no current
     temperature is an almanac, not a weather channel. */
  .wxlead { width: 26%; flex: none; display: flex; flex-direction: column; gap: 0.7em; }
  .wxname {
    letter-spacing: var(--track-label); font-size: var(--size-large); color: var(--ink);
    text-transform: none;
  }
  .wxnow { display: flex; align-items: flex-end; gap: 1.1em; }
  /* block, not an inline span: an inline SVG sits on the text baseline and the
     bottom row of dots gets clipped by the line box. */
  .wxnow .big { display: block; line-height: 0; }
  .wxnow .cond {
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--dim);
  }
  .wxextra {
    display: flex; gap: 2em;
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
  }
  .wxextra b { color: var(--dim); font-weight: 400; }
  .wxdays { display: flex; gap: 3vw; flex: 1; justify-content: space-between; padding-right: 8vw; }
  .wxday { display: flex; align-items: center; gap: 1.1em; }
  .wxday .icon { width: 2.4em; height: 2.4em; flex: none; }
  .wxday .icon svg { width: 100%; height: 100%; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .wxday .when { letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint); }
  .wxday .temps { letter-spacing: var(--track-tight); font-size: var(--size-base); color: var(--ink); }
  .wxday .temps .lo { color: var(--dim); }
  .wxday .rain {
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--red);
  }

  /* ---------- music (unchanged behaviour, themed values) ---------- */
  #mbody { flex: 1; display: flex; align-items: center; gap: 4vw; min-height: 0; }
  #mart { width: clamp(120px, 24vh, 260px); height: clamp(120px, 24vh, 260px); flex: none; line-height: 0; }
  #mart svg { width: 100%; height: 100%; display: block; }
  #minfo { min-width: 0; display: flex; flex-direction: column; gap: var(--space-3); }
  #mtitle { line-height: 0; }
  #martist {
    letter-spacing: var(--track-label); font-size: var(--size-large); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #malbum {
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #mprogwrap { display: flex; flex-direction: column; gap: var(--space-2); }
  #mbar { position: relative; height: var(--line-hair); background: var(--rule); }
  #mfill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); }
  #mhead {
    position: absolute; top: 50%; left: 0;
    width: 0.5em; height: 0.5em; margin: -0.25em 0 0 -0.25em;
    border-radius: 50%; background: var(--red);
    transition: transform 250ms linear;
  }
  #mtimes {
    display: flex; justify-content: space-between;
    letter-spacing: var(--track-label); font-size: var(--size-micro); color: var(--faint);
  }

  /* ---------- toast ---------- */
  #toast {
    position: absolute;
    left: 50%; bottom: var(--space-5);
    transform: translate(-50%, calc(100% + var(--space-5)));
    background: var(--panel);
    border: var(--line-hair) solid var(--rule);
    padding: 1em 1.8em;
    letter-spacing: var(--track-label);
    font-size: var(--size-small);
    display: flex; align-items: center; gap: 1em;
    transition: transform var(--motion-toast) var(--motion-ease);
    white-space: nowrap;
    z-index: 9;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast .tdot { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--red); flex: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage">

  <!-- HOME -->
  <div id="homeview" class="view on opaque">
    <div class="topbar">
      <div class="lead"><span class="reddot"></span><span id="datetext">—</span></div>
      <div id="weather-brief">
        <div class="temp" id="wtemp">··</div>
        <div id="wcond">—</div>
        <div class="tag" id="wtag"></div>
      </div>
    </div>
    <div id="clockzone">
      <div id="clock"></div>
      <div id="greeting">—</div>
    </div>
    <div id="nowplaying"><span class="npdot"></span><span id="nptext"></span></div>
    <div id="menu"></div>
    <div class="hints" id="homehints"></div>
  </div>

  <!-- TV — paints only the bar; mpv shows through everywhere else -->
  <div id="tvview" class="view">
    <div id="chanstate"><span class="pulse"><i></i><i></i><i></i></span><span id="chanstatetext"></span></div>
    <div id="digits"></div>
    <div id="chanbar">
      <div id="channum"></div>
      <div id="channame">—</div>
      <div id="barhint"></div>
      <div id="chanclock">--:--</div>
    </div>
    <div id="chanlist">
      <div class="listhead">
        <span id="chanhead"></span>
        <span id="chancount"></span>
      </div>
      <div id="chanrows"></div>
      <div class="hints" id="chanhints"></div>
    </div>
  </div>

  <!-- MOVIES / SHOWS share one view, switched by kind -->
  <div id="gridview" class="view opaque">
    <div class="gridhead">
      <div class="gridtitle" id="gridtitle"></div>
      <div class="gridcount"><span id="gridpage"></span>&nbsp;&nbsp;<span id="gridcount"></span></div>
    </div>
    <div class="grid" id="grid"><div id="gridinner"></div></div>
    <div class="hints" id="gridhints"></div>
    <div id="detail">
      <div id="dposter"></div>
      <div id="dinfo">
        <div id="dtitle"></div>
        <div id="dmeta"></div>
        <div id="dplot"></div>
        <div id="dcredits"></div>
        <div id="dreviews">
          <div class="rhead"><span id="rlabel"></span><span class="rdots" id="rdots"></span></div>
          <div id="rstack"></div>
        </div>
        <!-- A show gets this where a film gets the reviews above. Only one of
             the two is ever displayed; openDetail picks by kind. -->
        <div id="dseasons">
          <div class="rhead"><span id="slabel"></span><span id="scount"></span></div>
          <div id="stabs"></div>
          <div id="eplist"></div>
        </div>
        <div class="hints" id="detailhints"></div>
      </div>
    </div>
    <!-- The stream picker, over the detail panel. Sibling of #detail rather
         than a child so it slides across the whole screen, the way the
         channel list does over the picture. -->
    <div id="sources">
      <div class="listhead">
        <span id="srchead"></span>
        <span id="srccount"></span>
      </div>
      <div id="srcrows"></div>
      <div id="srcempty"></div>
      <div class="hints" id="srchints"></div>
    </div>
  </div>

  <!-- NEWS -->
  <div id="newsview" class="view opaque">
    <div class="newshalf" id="newstop"></div>
    <div class="newshalf" id="newsbottom"></div>
  </div>

  <!-- WEATHER -->
  <div id="weatherview" class="view opaque">
    <div class="topbar">
      <div class="lead"><span class="reddot"></span><span id="wxhead">—</span></div>
      <div id="wxclock">--:--</div>
    </div>
    <div id="wxgrid"></div>
    <div class="hints" id="wxhints"></div>
  </div>

  <!-- MUSIC -->
  <div id="musicview" class="view opaque">
    <div class="topbar">
      <div class="lead"><span class="reddot"></span><span id="mhead">—</span></div>
      <div id="mstate">—</div>
    </div>
    <div id="mbody">
      <div id="mart"></div>
      <div id="minfo">
        <div id="mtitle"></div>
        <div id="martist">—</div>
        <div id="malbum"></div>
      </div>
    </div>
    <div id="mprogwrap">
      <div id="mbar"><div id="mfill"></div><div id="mhead2"></div></div>
      <div id="mtimes"><span id="mpos">0:00</span><span id="mlen">0:00</span></div>
    </div>
    <div class="hints" id="mhints"></div>
  </div>

</div>

<div id="toast"><span class="tdot"></span><span id="toasttext"></span></div>

<script type="module" src="app.js"></script>
</body>
</html>
